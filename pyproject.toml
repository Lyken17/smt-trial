[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smtcomp-2025-cvc5-harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "polars>=1.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.scripts]
smtcomp-cvc5-config = "smtcomp_harness.config:main"
smtcomp-cvc5-dispatch = "smtcomp_harness.dispatch:main"
smtcomp-prepare-run = "smtcomp_harness.prepare:main"
smtcomp-score = "smtcomp_harness.score:main"

[tool.setuptools.packages.find]
where = ["src"]
