smtlib:
  QF_BV:
    sat.smt2:
      expected_result: SAT
      max_time_seconds: 5
      description: "Small satisfiable bit-vector formula"
    unsat.smt2:
      expected_result: UNSAT
      max_time_seconds: 5
      description: "Small contradictory bit-vector formula"

  QF_LIA:
    sat.smt2:
      expected_result: SAT
      max_time_seconds: 5
      description: "Small satisfiable linear integer formula"
    unsat.smt2:
      expected_result: UNSAT
      max_time_seconds: 5
      description: "Small contradictory linear integer formula"

  QF_NIA:
    sat.smt2:
      expected_result: SAT
      max_time_seconds: 5
      description: "Small satisfiable nonlinear integer formula"
    unsat.smt2:
      expected_result: UNSAT
      max_time_seconds: 5
      description: "Integer square cannot equal two"

  QF_S:
    sat.smt2:
      expected_result: SAT
      max_time_seconds: 5
      description: "Small satisfiable string formula"
    unsat.smt2:
      expected_result: UNSAT
      max_time_seconds: 5
      description: "Contradictory string length"

  UF:
    sat.smt2:
      expected_result: SAT
      max_time_seconds: 5
      description: "Quantified satisfiable uninterpreted-function formula"
    unsat.smt2:
      expected_result: UNSAT
      max_time_seconds: 5
      description: "Quantified contradictory uninterpreted-function formula"
